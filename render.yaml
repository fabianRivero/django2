# Blueprint de Render: define toda la infraestructura como código.
#
# Cómo hacer el deploy:
#   1. Subí este repo a GitHub.
#   2. En el dashboard de Render: "New" → "Blueprint" → elegí el repo.
#   3. Render lee este archivo, crea el Postgres y el web service, y
#      les inyecta las variables de entorno automáticamente.
#   4. Al terminar el build, corré desde el shell de Render:
#        python manage.py createsuperuser
#      (y si querés datos demo: python manage.py seed_demo)
#
# Docs del formato: https://render.com/docs/blueprint-spec

databases:
  - name: inventory-db
    databaseName: inventory
    user: inventory
    # PostgreSQL free: 90 días de vigencia sin uso — suficiente para
    # demo/eval. Para algo permanente, cambiá a "basic".
    plan: free

services:
  - type: web
    name: inventory-web
    runtime: python
    plan: free
    # El build instala dependencias y junta los estáticos en
    # STATIC_ROOT (whitenoise los sirve en runtime).
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # releaseCommand corre DESPUÉS de un build exitoso y ANTES de que
    # la nueva versión reciba tráfico — el lugar correcto para las
    # migraciones (si migran mal, el deploy se cancela y la versión
    # anterior sigue viva).
    releaseCommand: python manage.py migrate
    # Gunicorn: servidor WSGI de producción (runserver es solo dev).
    startCommand: gunicorn inventory_system.wsgi
    # Health check HTTP: Render marca el servicio como "live" cuando
    # esta ruta responde 200. El dashboard no requiere auth.
    healthCheckPath: /
    envVars:
      # Versión de Python del runtime de Render. 3.12 es la más
      # estable disponible; el código es compatible.
      - key: PYTHON_VERSION
        value: 3.12.10
      # Se genera una vez en el primer deploy y se reutiliza en los
      # siguientes (si no, las sesiones se invalidarían en cada deploy).
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # El punto inicial cubre <lo-que-sea>.onrender.com — el hostname
      # exacto no se sabe hasta el primer deploy.
      - key: ALLOWED_HOSTS
        value: .onrender.com
      # Conexión al Postgres definido arriba (inyectada por Render).
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
